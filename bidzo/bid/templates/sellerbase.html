<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BidZo Seller</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
        }

        /* NAVBAR */
        .navbar-custom {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            padding: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }

        .brand {
            font-weight: bold;
            font-size: 22px;
            color: white;
            letter-spacing: 1px;
        }

        .seller-name {
            color: white;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-link {
            color: white !important;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #60a5fa !important;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 72px;
            left: 0;
            background: linear-gradient(180deg, #0f172a, #1e3a8a);
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
            border-left: 3px solid transparent;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.08);
            border-left: 3px solid #60a5fa;
            padding-left: 25px;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 260px;
            padding: 100px 30px 30px;
        }

        /* BADGE */
        .badge {
            font-size: 11px;
        }

        /* DROPDOWN */
        .dropdown-menu {
            border-radius: 12px;
            border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .dropdown-item:hover {
            background: #eef2ff;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom fixed-top">

    <div class="container-fluid px-4 d-flex align-items-center position-relative">

        <!-- LEFT -->
        <a class="brand me-3" href="#">
            BidZo
        </a>

        <!-- CENTER -->
        <div class="seller-name position-absolute top-50 start-50 translate-middle">
            Seller Dashboard
        </div>

        <!-- RIGHT -->
        <div class="ms-auto d-flex align-items-center gap-3">

            <a class="nav-link" href="{% url 'profile' %}">
                Profile
            </a>

            <a class="nav-link" href="{% url 'logout' %}">
                Logout
            </a>

            <div class="dropdown">

                <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                    Account Settings
                </a>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a class="dropdown-item" href="{% url 'changepassword' %}">
                            Change Password
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </div>

</nav>

<!-- SIDEBAR -->
<div class="sidebar">

    <a href="{% url 'addproduct' %}">
        <i class="bi bi-plus-circle"></i> Add Product
    </a>

    <a href="{% url 'myproducts' %}">
        <i class="bi bi-box-seam"></i> My Products
    </a>

    <a href="{% url 'seller_notifications' %}">
        <i class="bi bi-bell"></i> Notifications

        {% if notification_count %}
            <span class="badge bg-danger ms-2">
                {{ notification_count }}
            </span>
        {% endif %}
    </a>

    <a href="{% url 'seller_complaint' %}">
        <i class="bi bi-exclamation-triangle"></i> Complaint Box
    </a>

</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
