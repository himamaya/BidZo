<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - BidZo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    font-family:'Segoe UI',sans-serif;
    position:relative;
    overflow:hidden;
}

/* Background Glow */

body::before{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    background:#38bdf8;
    border-radius:50%;
    top:-100px;
    left:-100px;
    filter:blur(120px);
    opacity:.20;
}

body::after{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    background:#60a5fa;
    border-radius:50%;
    bottom:-100px;
    right:-100px;
    filter:blur(120px);
    opacity:.20;
}

/* Navbar */

.navbar{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    padding:20px 0;
}

.navbar-brand{
    color:white !important;
    font-size:2rem;
    font-weight:700;
}

.logout-btn{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;
    transition:.3s;
}


.back-btn:hover{
    background:rgba(255,255,255,.1);
    color:white;
}

/* Card */

.password-card{
    max-width:550px;
    margin:70px auto;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:40px;
    color:white;
}

/* Title */

.title{
    text-align:center;
    color:white;
    font-weight:700;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

/* Labels */

.form-label{
    color:white;
    font-weight:600;
}

/* Inputs */

.form-control{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    color:white;
    padding:12px;
    border-radius:12px;
}

.form-control:focus{
    background:rgba(255,255,255,.08);
    color:white;
    border-color:#38bdf8;
    box-shadow:none;
}

.form-control::placeholder{
    color:#94a3b8;
}

/* Button */

.btn-change{
    width:100%;
    background:#38bdf8;
    color:white;
    border:none;
    padding:12px;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.btn-change:hover{
    background:#0ea5e9;
    color:white;
}
</style>
</head>

<body>

<nav class="navbar">

        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand"
                href="">

                BidZo

            </a>

            <a href="{% url 'logout' %}"
                class="logout-btn">

                Logout

            </a>

        </div>

    </nav>


<!-- PASSWORD CARD -->

<div class="container">

    <div class="password-card">

        <div class="text-center mb-4">

            <div style="font-size:55px;">
                
            </div>

            <h2 class="title">
                Change Password
            </h2>

            <p class="subtitle">
                Keep your Bidzo account secure
            </p>

        </div>

        

        <!-- MESSAGES -->
        {% if messages %}
            {% for i in messages %}
                <div class="alert alert-success alert-dismissible fade show">
                    {{ i }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- FORM -->
        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>

            <button type="submit" class="btn-change">
                <i class="bi bi-check-circle-fill"></i>
                Update Password
            </button>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
