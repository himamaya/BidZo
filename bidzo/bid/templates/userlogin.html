<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bidzo | User Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
    position:relative;
}

/* Background Glow */

body::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#38bdf8;
    border-radius:50%;
    top:-100px;
    left:-100px;
    filter:blur(120px);
    opacity:.25;
}

body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#60a5fa;
    border-radius:50%;
    bottom:-100px;
    right:-100px;
    filter:blur(120px);
    opacity:.25;
}

/* Welcome Text */

.welcome-title{
    color:white;
    font-size:3.5rem;
    font-weight:800;
    text-align:center;
    margin-bottom:10px;
}

.welcome-title span{
    color:#38bdf8;
}

.welcome-subtitle{
    text-align:center;
    color:#cbd5e1;
    letter-spacing:3px;
    margin-bottom:30px;
}

/* Login Card */

.login-card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:40px;
    color:white;
    position:relative;
    z-index:10;
}

/* Logo */

.logo{
    text-align:center;
    font-size:3rem;
    margin-bottom:10px;
}

/* Titles */

.login-title{
    text-align:center;
    font-weight:700;
    margin-bottom:5px;
}

.login-subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

/* Form */

.form-label{
    color:white;
}

.form-control{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
    padding:12px;
}

.form-control::placeholder{
    color:#94a3b8;
}

.form-control:focus{
    background:rgba(255,255,255,0.08);
    color:white;
    border-color:#38bdf8;
    box-shadow:none;
}

.input-group-text{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
}

/* Button */

.btn-login{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:white;
    font-weight:600;
    transition:.3s;
}

.btn-login:hover{
    background:#0ea5e9;
    color:white;
}

/* Register */

.register-link{
    text-align:center;
    margin-top:20px;
    color:#cbd5e1;
}

.register-link a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:600;
}

.register-link a:hover{
    color:white;
}

/* Alert */

.alert{
    border-radius:12px;
}

/* Responsive */

@media(max-width:768px){

    .welcome-title{
        font-size:2.5rem;
    }

    .login-card{
        padding:30px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-5 col-md-7">

<div class="text-center">

<h1 class="welcome-title">
Welcome to <span>Bidzo</span>
</h1>

<p class="welcome-subtitle">
BID • BUY • WIN
</p>

</div>

<div class="login-card">



<h3 class="login-title">
 Login
</h3>

<p class="login-subtitle">
Sign in to continue your bidding journey
</p>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
Email Address
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-envelope-fill"></i>
</span>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

</div>

<div class="mb-4">

<label class="form-label">
Password
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter your password"
required>

</div>

</div>

<button type="submit" class="btn btn-login">
Login
</button>

</form>

<div class="register-link">

Don't have an account?

<a href="{% url 'userregistration' %}">
Create Account
</a>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
