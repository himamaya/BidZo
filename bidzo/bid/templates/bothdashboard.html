<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bidzo | Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    font-family:'Segoe UI',sans-serif;
    position:relative;
    overflow-x:hidden;
}

/* Background Glow */

body::before{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    background:#38bdf8;
    border-radius:50%;
    top:-100px;
    left:-100px;
    filter:blur(120px);
    opacity:.20;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    background:#60a5fa;
    border-radius:50%;
    bottom:-100px;
    right:-100px;
    filter:blur(120px);
    opacity:.20;
    z-index:-1;
}

/* Navbar */

.navbar{
    background:transparent;
    padding:20px 0;
}

.navbar-brand{
    color:white !important;
    font-size:2rem;
    font-weight:700;
}

.logout-btn{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;
    transition:.3s;
}

.logout-btn:hover{
    background:rgba(255,255,255,.1);
    color:white;
}

/* Dashboard */

.dashboard-container{
    max-width:1000px;
    margin:70px auto;
}

/* Welcome */

.welcome-box{
    text-align:center;
    margin-bottom:50px;
}

.welcome-box h1{
    color:white;
    font-weight:800;
    font-size:3rem;
}

.welcome-box p{
    color:#cbd5e1;
    font-size:18px;
}

/* Cards */

.card-box{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:40px;
    text-align:center;
    color:white;
    transition:.3s;
    height:100%;
}

.card-box:hover{
    transform:translateY(-8px);
}

.icon{
    font-size:60px;
    color:#38bdf8;
    margin-bottom:20px;
}

.card-box h4{
    font-weight:700;
    margin-bottom:10px;
}

.card-box p{
    color:#cbd5e1;
}

/* Buttons */

.btn-go{
    background:#38bdf8;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:12px;
    text-decoration:none;
    display:inline-block;
    margin-top:15px;
    font-weight:600;
    transition:.3s;
}

.btn-go:hover{
    background:#0ea5e9;
    color:white;
}

/* Responsive */

@media(max-width:768px){

    .welcome-box h1{
        font-size:2rem;
    }

    .card-box{
        padding:30px;
    }

}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" href="#">
             BIDZO
        </a>

        <a href="{% url 'logout' %}" class="logout-btn">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>

</nav>

<!-- DASHBOARD -->

<div class="container dashboard-container">

    <div class="welcome-box">

        <h1>
            Welcome {{ user.first_name }} 
        </h1>

        <p>
            Choose your dashboard and start managing your auctions
        </p>

    </div>

    <div class="row g-4">

        <!-- Buyer -->

        <div class="col-md-6">

            <div class="card-box">

                <i class="bi bi-cart-fill icon"></i>

                <h4>
                    Buyer Dashboard
                </h4>

                <p>
                    Explore products, place bids and track your auctions.
                </p>

                <a href="{% url 'buyerhome' %}" class="btn-go">
                    Go to Buyer
                </a>

            </div>

        </div>

        <!-- Seller -->

        <div class="col-md-6">

            <div class="card-box">

                <i class="bi bi-shop icon"></i>

                <h4>
                    Seller Dashboard
                </h4>

                <p>
                    Manage products, auctions and monitor sales.
                </p>

                <a href="{% url 'sellerdashboard' %}" class="btn-go">
                    Go to Seller
                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
